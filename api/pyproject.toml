[project]
name = "maps"
version = "0.1.0"
description = "On Exactitude in Science"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiodns == 2.0.0",
  "aiohttp-middlewares == 1.1.0",
  "aiohttp == 3.7.4",
  "aiomcache == 0.6.0",
  "cchardet == 2.1.6",
  "goblin == 2.2.3",
  "gunicorn == 20.0.4",
  "lxml == 4.6.2",
  "msgpack == 1.0.0",
  "tqdm == 4.50.2",
  "uqbar == 0.4.8",
  "uvloop == 0.14.0",
]

[project.optional-dependencies]
test = [
  "black == 19.10b0",
  "flake8",
  "isort",
  "mypy >= 0.720",
  "pytest >= 5.4.0",
  "pytest-asyncio >= 0.14.0",
  "pytest-cov",
  "ruff",
]

[project.urls]
homepage = "https://github.com/josephine-wolf-oberholtzer/on-exactitude-in-science"
documentation = "https://josephine-wolf-oberholtzer.github.io/on-exactitude-in-science"
repository = "https://github.com/josephine-wolf-oberholtzer/on-exactitude-in-science"

[tool.ruff]
line-length = 88
target-version = "py311"
