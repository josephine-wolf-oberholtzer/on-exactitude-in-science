[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.11,<0.10.0"]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "types-lxml",
  "types-tqdm",
]

[project]
dependencies = [
  "alembic",
  "asyncpg",
  "click",
  "fastapi",
  "gunicorn",
  "lxml",
  "psycopg2-binary",
  "sqlalchemy",
  "uqbar",
  "uvicorn-worker",
  "uvloop",
]
description = "On Exactitude in Science"
license = {text = "MIT"}
name = "maps"
readme = "README.md"
requires-python = ">=3.15"
version = "0.1.0"

[project.urls]
homepage = "https://github.com/josephine-wolf-oberholtzer/on-exactitude-in-science"
documentation = "https://josephine-wolf-oberholtzer.github.io/on-exactitude-in-science"
repository = "https://github.com/josephine-wolf-oberholtzer/on-exactitude-in-science"

[tool.mypy]
plugins = ["mypy_plugin_lxml.main"]

[tool.pytest]
addopts = ["-rf", "-vv"]
log_format = "%(levelname)-8s %(name)s:%(filename)s:%(lineno)-4d %(message)s"

[tool.ruff]
line-length = 88
target-version = "py315"
