name: Testing
on:
  pull_request:
    branches:
    - master
jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Pull Docker images
      run: docker-compose pull
    - name: Bring backing containers online
      run: docker-compose up -d scylla elasticsearch janusgraph
    - name: Pull latest
      run: docker pull josiahwolfoberholtzer/on-exactitude-in-science-api:latest
    - name: Build API container
      run: docker-compose build backend
    - name: Run black
      run: |
        docker-compose run --rm backend black --version
        docker-compose run --rm backend make black-check
    - name: Run flake8
      run: |
        docker-compose run --rm backend flake8 --version
        docker-compose run --rm backend make flake8
    - name: Run mypy
      run: |
        docker-compose run --rm backend mypy --version
        docker-compose run --rm backend make mypy
    - name: Wait for JanusGraph
      run: docker-compose run --rm janusgraph-healthcheck
    - name: Load schema
      run: docker-compose run --rm backend python3 -m maps schema --graph testgraph load
    - name: Run pytest
      run: |
        docker-compose run --rm backend pytest --version
        docker-compose run --rm backend make pytest
    - name: Dump Docker logs
      if: ${{ failure() }}
      run: docker-compose logs
    - name: Stop containers
      if: ${{ always() }}
      run: docker-compose stop
  gui:
    name: GUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v1
      with:
        node-version: '12'
    - name: Install
      run: yarn install
    - name: Lint
      run: yarn lint
    - name: Test
      run: yarn test
