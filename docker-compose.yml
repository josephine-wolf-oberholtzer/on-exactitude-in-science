services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: gunicorn "maps.api:create_app()"
    environment:
      # Gunicorn only reads GUNICORN_CMD_ARGS from the environment, not a
      # GUNICORN_<SETTING> variable per setting.
      # The control socket can't be created on the bind-mounted source directory.
      GUNICORN_CMD_ARGS: >-
        --access-logfile -
        --bind 0.0.0.0:9090
        --capture-output
        --control-socket /tmp/gunicorn.ctl
        --enable-stdio-inheritance
        --error-logfile -
        --log-level debug
        --reload
        --worker-class uvicorn_worker.UvicornWorker
        --workers 4
    ports:
    - 9090:9090
    volumes:
    - ./backend:/app/backend
    - ./data:/data
  frontend:
    build:
      context: frontend
    ports:
    - 8080:80
    volumes:
    - ./frontend/dist:/var/www/html
  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:18
    ports:
    - 5432:5432
