services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >-
      uvicorn
      --factory
      --host 0.0.0.0
      --port 9090
      --reload
      --reload-dir /app/backend/src
      maps.api:create_app
    ports:
    - 9090:9090
    volumes:
    - ./backend:/app/backend
    - ./data:/data
  frontend:
    build:
      context: frontend
    ports:
    - 8080:80
    volumes:
    - ./frontend/dist:/var/www/html
  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:18
    ports:
    - 5432:5432
